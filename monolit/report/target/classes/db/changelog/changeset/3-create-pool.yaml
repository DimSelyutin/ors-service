databaseChangeLog:
  - changeSet:
      id: "3"
      author: DimSelyutin
      changes:
        - createTable:
            tableName: pool
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: location
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: "capacity > 0"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: pool
            columnNames: name, location
            constraintName: uq_pool_name_location
      rollback:
        - dropTable:
            tableName: pool



