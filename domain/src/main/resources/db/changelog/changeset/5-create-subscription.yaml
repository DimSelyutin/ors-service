databaseChangeLog:
  - changeSet:
      id: "5"
      author: DimSelyutin
      changes:
        - createTable:
            tableName: subscription
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT(300)
              - column:
                  name: duration
                  type: subscription_duration
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    checkConstraint: "price > 0"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: subscription
            columnNames: name
            constraintName: uq_subscription_name
      rollback:
        - dropTable:
            tableName: subscription

