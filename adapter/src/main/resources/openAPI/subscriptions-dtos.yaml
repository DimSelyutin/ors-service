components:
  schemas:
    SubscriptionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          example: "Premium Plan"
        description:
          type: string
          example: "Access to all premium features"
        duration:
          type: string
          enum: [WEEK, MONTH, YEAR]
          example: MONTH
        price:
          type: number
          format: double
          example: 29.99
        createdAt:
          type: string
          format: date-time
          example: "2024-06-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-06-05T15:30:00Z"

    SubscriptionCreateDTO:
      type: object
      required:
        - name
        - duration
        - price
      properties:
        name:
          type: string
          example: "Premium Plan"
        description:
          type: string
          example: "Access to all premium features"
        duration:
          type: string
          enum: [WEEK, MONTH, YEAR]
          example: MONTH
        price:
          type: number
          format: double
          example: 29.99

    SubscriptionUpdateDTO:
      type: object
      properties:
        name:
          type: string
          example: "Premium Plan"
        description:
          type: string
          example: "Access to all premium features"
        duration:
          type: string
          enum: [WEEK, MONTH, YEAR]
          example: MONTH
        price:
          type: number
          format: double
          example: 29.99

    UserSubscriptionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "e7e6f9b9-1f4a-4a9e-8b6f-123456789abc"
        userId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
        subscriptionId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        estimate:
          type: integer
          example: 5
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-30"
        createdAt:
          type: string
          format: date-time
          example: "2024-06-01T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-06-05T15:30:00Z"

    UserSubscriptionCreateDTO:
      type: object
      required:
        - userId
        - subscriptionId
        - estimate
        - startDate
        - endDate
      properties:
        userId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
        subscriptionId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        estimate:
          type: integer
          example: 5
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-30"

    UserSubscriptionUpdateDTO:
      type: object
      properties:
        estimate:
          type: integer
          example: 5
        startDate:
          type: string
          format: date
          example: "2024-06-01"
        endDate:
          type: string
          format: date
          example: "2024-06-30"
