databaseChangeLog:
  - changeSet:
      id: "1"
      author: DimSelyutin
      changes:
        - sql: CREATE TYPE user_role AS ENUM ('USER', 'ADMIN');
        - sql: CREATE TYPE subscription_duration AS ENUM ('day', 'week', 'month', 'year');
        - sql: CREATE TYPE booking_status AS ENUM ('CONFIRMED', 'CANCELLED', 'PENDING');
      rollback:
        - sql: DROP TYPE IF EXISTS booking_status;
        - sql: DROP TYPE IF EXISTS subscription_duration;
        - sql: DROP TYPE IF EXISTS user_role;