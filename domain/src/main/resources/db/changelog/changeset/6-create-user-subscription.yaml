databaseChangeLog:
  - changeSet:
      id: "6"
      author: DimSelyutin
      changes:
        - createTable:
            tableName: user_subscription
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_subscription_users
                    references: users(id)
              - column:
                  name: membership_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_subscription_subscription
                    references: subscription(id)
              - column:
                  name: estimate
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_subscription
            columnNames: user_id, start_date, end_date
            constraintName: uq_user_subscription_user_start_end
      rollback:
        - dropTable:
            tableName: user_subscription