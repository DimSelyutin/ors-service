services:
  postgres-gateway:
    image: "postgres:17.5"
    environment:
      POSTGRES_DB: "swimdom_auth"
      POSTGRES_USER: "swimdom_admin"
      POSTGRES_PASSWORD: "swimdom_pwd"
    ports:
      - "5432:5432"
    restart: 'always'
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U api-gateway -d swimdom_auth'" ]

  api-gateway:
    build:
      dockerfile: ./Dockerfile
    ports:
      - 8080:8080
    environment:
      - 'DB_URL=jdbc:postgresql://postgres/swimdom_auth'
      - 'DB_USERNAME=swimdom_admin'
      - 'DB_PASSWORD=swimdom_pwd'
    depends_on:
      postgres:
        condition: service_healthy
  redis-service:
    image: redis:latest
    ports:
      - "6379:6379"