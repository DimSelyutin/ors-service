spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS gen_random_uuid FOR "java.util.UUID.randomUUID"
    driverClassName: org.h2.Driver
    username: sa
    password:
  liquibase:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS gen_random_uuid FOR "java.util.UUID.randomUUID"
    user: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
