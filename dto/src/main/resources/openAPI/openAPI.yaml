openapi: 3.0.3

info:
  title: Swimming Service
  description: Service for buying tickets at swimming pools.
  version: 1.0.0

paths:
    /pools:
        tags:
          - Pools
        $ref: './pool-dtos.yaml#/pools'
    /pools/filter:
        tags:
          - Pools
        $ref: './pool-dtos.yaml#/poolsFilter'
    /subscriptions:
        $ref: './subscriptions-dtos.yaml#/subscriptions'
    /subscriptions/{id}:
        $ref: './subscriptions-dtos.yaml#/subscriptionById'
    /subscriptions/filter:
        $ref: './subscriptions-dtos.yaml#/getSubscriptionByFilter'
    /user/subscriptions:
