databaseChangeLog:
  - changeSet:
      id: "1"
      author: extracted
      changes:
        - sql:
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'user_role') THEN
                  CREATE TYPE user_role AS ENUM ('USER', 'ADMIN');
                END IF;
              END$$;
      rollback:
        - sql:
            sql: |
              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_type WHERE typname = 'user_role') THEN
                  DROP TYPE user_role;
                END IF;
              END$$;

