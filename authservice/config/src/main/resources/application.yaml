server:
    port: 8080
spring:
  application:
    name: authservice
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swimdom_auth}
    username: ${DB_USERNAME:swimdom_admin}
    password: ${DB_PASSWORD:swimdom_pwd}
  data:
      redis:
        host: ${REDIS_HOST:127.0.0.1}
        port: ${REDIS_PORT:30379}
        key-prefix: "authservice"
  jpa:
    properties:
      hibernate:
        globally_quoted_identifiers=true

  liquibase:
    change-log: db/changelog/changelog-master.yml
    enabled: true
    default-schema: public
    drop-first: false
logging:
    level:
      root: INFO
management:
  endpoints:
    enabled-by-default: false
    web.exposure.include: health, prometheus, loggers
  endpoint:
    health.enabled: true
    prometheus.enabled: true
    loggers.enabled: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
token:
    secret:
        access: "yF8nG7xvJ+2K0mZrTq6L3p9vX4Yw5Zs8QeRfU1aN6bH7jK0pLqMwNxYzVtRgSeDf"
        refresh: "yF8nG7xvJ+2K0mZrTq6L3p9vX4Yw5Zs8QeRfU1aN6bH7jK0pLqMwNxYzVtRgSe=="
    prefix: "Bearer"
    accessExpirationMinutes: 600_000
    refreshExpirationDays: 7
    content_type: application/json
    header_string: "Authorization"
