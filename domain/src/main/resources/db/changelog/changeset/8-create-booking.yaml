databaseChangeLog:
  - changeSet:
      id: "8"
      author: DimSelyutin
      changes:

        - createTable:
            tableName: booking
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_booking_users
                    references: users(id)
              - column:
                  name: user_subscription_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_subscription
                    references: subscription(id)
              - column:
                  name: schedule_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_booking_schedule
                    references: schedule(id)
              - column:
                  name: status
                  type: booking_status
                  constraints:
                    nullable: false
              - column:
                  name: booking_datetime
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: notification_sent
                  type: boolean
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: booking
            columnNames: user_id, schedule_id
            constraintName: uq_booking_user_schedule
      rollback:
        - dropTable:
            tableName: booking
