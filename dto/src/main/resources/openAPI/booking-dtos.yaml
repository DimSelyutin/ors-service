bookings:
 post:
   summary: Create a new booking
   operationId: createBooking
   requestBody:
     required: true
     content:
       application/json:
         schema:
           $ref: '#/components/schemas/BookingCreateRequestDTO'
   responses:
     '201':
       description: Booking successfully created
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/BookingResponseDTO'
     '400':
       description: Validation error

bookingsId:
 parameters:
   - in: path
     name: id
     schema:
       type: string
       format: uuid
     required: true
     description: Booking ID
 get:
   summary: Get a booking by ID
   operationId: getBookingsById
   responses:
     '200':
       description: Successful response
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/BookingResponseDTO'
     '404':
       description: Booking not found
 put:
   summary: Update a booking by ID
   operationId: updateBookingsById
   requestBody:
     required: true
     content:
       application/json:
         schema:
           $ref: '#/components/schemas/BookingUpdateRequestDTO'
   responses:
     '200':
       description: Booking successfully updated
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/BookingResponseDTO'
     '400':
       description: Validation error
     '404':
       description: Booking not found
 delete:
   summary: Delete a booking by ID
   operationId: deleteBookingById
   responses:
     '204':
       description: Booking successfully deleted
     '404':
       description: Booking not found

bookingsByUser:
 get:
   summary: Get all bookings for a user
   operationId: getBookingByUser
   parameters:
     - in: query
       name: userId
       schema:
         type: string
         format: uuid
       required: true
       description: User ID
   responses:
     '200':
       description: Successful response
       content:
         application/json:
           schema:
             type: array
             items:
               $ref: '#/components/schemas/BookingResponseDTO'
     '404':
       description: User or bookings not found

bookingsInRange:
 get:
   summary: Get bookings in a datetime range
   operationId: getBookingsByRange
   properties:
     from:
       in: path
       type: string
       format: date-time
       required: true
       description: Start datetime (inclusive)
       example: "2024-06-21T17:00:00Z"
     to:
       in: path
       type: string
       format: date-time
       required: true
       description: End datetime (exclusive)
       example: "2024-06-21T18:00:00Z"
   responses:
     '200':
       description: Successful response
       content:
         application/json:
           schema:
             type: array
             items:
               $ref: '#/components/schemas/BookingResponseDTO'
     '400':
       description: Invalid datetime format

bookingsAvailability:
 get:
   summary: Check if pool is available for booking in given time slot
   operationId: getBookingAvailability

   properties:
     startTime:
       type: string
       format: date-time
       required: true
       description: Start time of the time slot
       example: "2024-06-21T17:00:00Z"
     endTime:
       type: string
       format: date-time
       required: true
       description: End time of the time slot
       example: "2024-06-21T18:00:00Z"
   responses:
     '200':
       description: Availability check result
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/AvailabilityResponseDTO'
     '400':
       description: Invalid datetime format

bookingsFilter:
 post:
   summary: Get bookings by filter
   operationId: getBookingsByFilters
   requestBody:
     required: true
     content:
       application/json:
         schema:
           $ref: '#/components/schemas/BookingFilterDTO'
   responses:
     '200':
       description: Successful response
       content:
         application/json:
           schema:
             type: array
             items:
               $ref: '#/components/schemas/BookingResponseDTO'
     '400':
       description: Validation error

components:
  schemas:
    BookingResponseDTO:
      type: object
      required:
        - id
        - userId
        - userSubscriptionId
        - scheduleId
        - status
        - bookingDatetime
        - notificationSent
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique booking identifier
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        userId:
          type: string
          format: uuid
          description: ID of the user who made the booking
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        userSubscriptionId:
          type: string
          format: uuid
          description: ID of the user's subscription used
          example: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        scheduleId:
          type: string
          format: uuid
          description: ID of the schedule for the booking
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
          description: Booking status
          example: "PENDING"
        bookingDatetime:
          type: string
          format: date-time
          description: Date and time when the booking was made
          example: "2024-06-20T15:30:00Z"
        notificationSent:
          type: boolean
          description: Whether notification was sent
          example: false
        createdAt:
          type: string
          format: date-time
          description: Booking creation timestamp
          example: "2024-06-20T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Booking last update timestamp
          example: "2024-06-20T12:00:00Z"

    BookingCreateRequestDTO:
      type: object
      required:
        - userId
        - userSubscriptionId
        - scheduleId
        - bookingDatetime
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the user who makes the booking
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        userSubscriptionId:
          type: string
          format: uuid
          description: ID of the user's subscription to use
          example: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        scheduleId:
          type: string
          format: uuid
          description: Schedule ID to book
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        bookingDatetime:
          type: string
          format: date-time
          description: Date and time of the booking
          example: "2024-06-20T15:30:00Z"

    BookingUpdateRequestDTO:
      type: object
      required:
        - id
        - userId
        - userSubscriptionId
        - scheduleId
        - status
        - bookingDatetime
        - notificationSent
      properties:
        id:
          type: string
          format: uuid
          description: ID of the booking
          example: "5c2b3c4d-5e6f-428b-9c0d-1e2f3a4b5c42d"
        userId:
          type: string
          format: uuid
          description: ID of the user who makes the booking
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        userSubscriptionId:
          type: string
          format: uuid
          description: ID of the user's subscription to use
          example: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        scheduleId:
          type: string
          format: uuid
          description: Schedule ID to book
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
          description: Booking status
          example: "CONFIRMED"
        bookingDatetime:
          type: string
          format: date-time
          description: Date and time of the booking
          example: "2024-06-21T17:00:00Z"
        notificationSent:
          type: boolean
          description: Whether notification was sent
          example: true

    BookingFilterDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: Filter by user ID
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        userSubscriptionId:
          type: string
          format: uuid
          description: Filter by user subscription ID
          example: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        scheduleId:
          type: string
          format: uuid
          description: Filter by schedule ID
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
          description: Filter by booking status
          example: "CONFIRMED"
        bookingDatetimeFrom:
          type: string
          format: date-time
          description: Filter by booking datetime from (inclusive)
          example: "2024-06-20T00:00:00Z"
        bookingDatetimeTo:
          type: string
          format: date-time
          description: Filter by booking datetime to (exclusive)
          example: "2024-06-21T23:59:59Z"
        createdAtFrom:
          type: string
          format: date-time
          description: Filter by creation date from (inclusive)
          example: "2024-06-01T00:00:00Z"
        createdAtTo:
          type: string
          format: date-time
          description: Filter by creation date to (exclusive)
          example: "2024-06-30T23:59:59Z"
        notificationSent:
          type: boolean
          description: Filter by notification sent status
          example: false

    AvailabilityResponseDTO:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
          description: Whether the pool is available for booking
          example: true