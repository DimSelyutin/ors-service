pools:
  post:
    tags:
      - Pools
    summary: Create a new pool
    description: Adds a new swimming pool to the system.
    operationId: createPool
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoolDto'
    responses:
      '201':
        description: Pool created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolDto'
      '400':
        $ref: './error-dto.yaml#/components/responses/BadRequest'
      '409':
        $ref: './error-dto.yaml#/components/responses/Conflict'
      '500':
        $ref: './error-dto.yaml#/components/responses/InternalServerError'

poolsFilter:
  post:
    tags:
      - Pools
    summary: Retrieve pools by filter
    description: Returns a list of swimming pools matching the filter criteria.
    operationId: getPools
    requestBody:
      description: Filter criteria as PoolDto
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoolDto'
    responses:
      '200':
        description: A list of pools matching the filter
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PoolDto'
      '204':
        description: No pools found
      '400':
        $ref: './error-dto.yaml#/components/responses/BadRequest'
      '404':
        $ref: './error-dto.yaml#/components/responses/NotFound'
      '409':
        $ref: './error-dto.yaml#/components/responses/Conflict'
      '500':
        $ref: './error-dto.yaml#/components/responses/InternalServerError'

components:
  schemas:
    PoolDto:
      type: object
      description: Represents a swimming pool entity.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the pool.
        poolWorkingHours:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PoolWorkingHoursDto'
        name:
          type: string
          maxLength: 150
          description: Name of the pool.
        description:
          type: string
          maxLength: 255
          description: Description of the pool.
          nullable: true
        location:
          type: string
          maxLength: 255
          description: Location of the pool.
          nullable: true
        capacity:
          type: integer
          format: int32
          description: Capacity of the pool.
          minimum: 1
        created_at:
          type: string
          format: date-time
          description: Timestamp when the pool was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the pool was last updated.
      required:
        - id
        - name
        - capacity
        - created_at
        - updated_at
    PoolWorkingHoursDto:
        type: object
        description: Working times
        properties:
          poolId:
            type: string
            format: uuid
            example: "2c963f66afa6-5717-4562-b3fc-3fa85f64"
          weekday:
            type: integer
            format: int32
            x-java-type: Short
            description: Week of days (1 — monday, 7 — sunday)
            minimum: 1
            maximum: 7
            example: 1
          openTime:
            type: string
            format: time
            description: Opening time
            example: "08:00:00"
          closeTime:
            type: string
            format: time
            description: Close time
            example: "22:00:00"
        required:
          - weekday
          - openTime
          - closeTime
    DeletePoolByDay:
      type: object
      description: Represents a swimming pool entity.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the pool.
        weekday:
          type: integer
          format: int32
          description: Week of days (1 — monday, 7 — sunday)
          example: 1