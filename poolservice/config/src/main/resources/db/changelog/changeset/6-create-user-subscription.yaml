databaseChangeLog:
  - changeSet:
      id: 6-create-user-subscription
      author: swimdom
      changes:
        - createTable:
            tableName: user_subscription
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: subscription_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: estimate
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: user_subscription
            baseColumnNames: subscription_id
            referencedTableName: subscription
            referencedColumnNames: id
            constraintName: fk_user_subscription_subscription
            onDelete: CASCADE


