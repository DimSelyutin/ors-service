databaseChangeLog:
  - changeSet:
      id: "3-add-security-fields-to-users"
      author: DimSelyutin
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: account_non_expired
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: account_non_locked
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: credentials_non_expired
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            columnName: enabled
            tableName: users
        - dropColumn:
            columnName: credentials_non_expired
            tableName: users
        - dropColumn:
            columnName: account_non_locked
            tableName: users
        - dropColumn:
            columnName: account_non_expired
            tableName: users
